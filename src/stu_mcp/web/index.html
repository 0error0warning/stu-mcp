<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>STU MCP</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="mark" aria-hidden="true">S</div>
    <div>
      <h1>STU MCP</h1>
      <p class="sub">汕大校园数据 · 在这台电脑上运行</p>
    </div>
  </header>

  <section aria-labelledby="accounts-title">
    <h2 id="accounts-title">学校账号</h2>
    <p class="hint">公开通知无需登录。点登录会打开学校页面，在那里输入密码。</p>
    <div class="card list">
      <div class="row" data-service="jw" data-desc="成绩、考试安排">
        <span class="ico jw" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 5l9 4.5-9 4.5z"/><path d="M7 11.8v4.4c1.4 1.3 3.1 1.8 5 1.8s3.6-.5 5-1.8v-4.4"/><path d="M21 9.5v4.5"/></svg></span>
        <div class="info"><strong>教务系统</strong><span class="meta">成绩、考试安排</span></div>
        <button class="act" type="button" aria-controls="panel-jw">登录</button>
      </div>
      <div class="panel" id="panel-jw" hidden>
        <p>教务的成绩接口目前只能走未加密的 HTTP。继续即允许 STU MCP 通过 HTTP 读取成绩；密码仍只在学校的 HTTPS 登录页输入。</p>
        <div class="actions">
          <button class="primary" id="jw-continue" type="button">继续登录</button>
        </div>
      </div>

      <div class="row" data-service="mystu" data-desc="课程、作业、日程">
        <span class="ico mystu" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg></span>
        <div class="info"><strong>MySTU</strong><span class="meta">课程、作业、日程</span></div>
        <button class="act" type="button">登录</button>
      </div>

      <div class="row" data-service="yuketang" data-desc="课程、作业、公告">
        <span class="ico ykt" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 15.5a4 4 0 0 1-.3-8A5.5 5.5 0 0 1 17.3 9a3.3 3.3 0 0 1-.3 6.5z"/><path d="m9 18.5-.8 1.8"/><path d="m13 18.5-.8 1.8"/><path d="m17 18.5-.8 1.8"/></svg></span>
        <div class="info"><strong>雨课堂</strong><span class="meta">课程、作业、公告</span></div>
        <button class="act" type="button">登录</button>
      </div>

      <div class="row" data-service="oa" data-desc="校外读取 OA 通知时需要">
        <span class="ico vpn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.2c0 4.3-2.9 8-7 9.3-4.1-1.3-7-5-7-9.3V6z"/><path d="m9.2 12 2 2 3.8-4"/></svg></span>
        <div class="info"><strong>WebVPN</strong><span class="meta">校外读取 OA 通知时需要</span></div>
        <button class="act" type="button" aria-controls="panel-oa">设置</button>
      </div>
      <div class="panel" id="panel-oa" hidden>
        <div id="vpn-manage" hidden>
          <p id="vpn-status"></p>
          <div class="actions">
            <button class="primary" id="vpn-edit" type="button">更新账号</button>
            <button class="ghost danger" id="vpn-logout" type="button">断开</button>
          </div>
        </div>
        <form id="vpn-form" autocomplete="off">
          <label>学号<input id="vpn-user" autocomplete="off" maxlength="128" required></label>
          <label>密码<input id="vpn-pass" type="password" autocomplete="off" maxlength="1024" required></label>
          <label>动态口令密钥<input id="vpn-totp" type="password" autocomplete="off" maxlength="2048" required placeholder="密钥或 otpauth:// 链接"></label>
          <p class="note">填绑定令牌时拿到的密钥，不是 6 位验证码。账号存进系统钥匙串，会话过期时自动重新登录。</p>
          <div class="actions">
            <button class="primary" id="vpn-save" type="submit">保存</button>
            <button class="ghost" id="vpn-alt" type="button">改用浏览器登录</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer>账号和登录状态只保存在这台电脑，不会通过 MCP 交给 agent。<span id="version"></span></footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
