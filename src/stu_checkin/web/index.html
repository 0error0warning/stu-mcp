<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>对分易签到</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></div>
      <h1>对分易签到</h1>
      <div class="menu-wrap">
        <button class="more" id="menu-button" type="button" aria-label="更多操作" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        <div class="menu" id="menu" hidden><button type="button" id="quit">退出服务</button></div>
      </div>
    </header>

    <div class="notice" id="notice" role="status" hidden></div>
    <section class="card" aria-label="签到设置">
      <div class="row account-row">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10.8c0 4.4-4 7.5-8.5 7.5-1.2 0-2.4-.2-3.5-.7L4 19l1.1-3.5A6.7 6.7 0 0 1 3 10.8C3 6.6 6.8 3.5 11.5 3.5S20 6.6 20 10.8Z"/><path d="M8 10h.01M15 10h.01" stroke-width="2.7"/></svg></span>
        <div class="info"><strong>微信账号</strong><span class="meta" id="account-label">未登录</span></div>
        <button class="act" id="account-button" type="button" aria-expanded="false" aria-controls="account-panel" disabled>登录</button>
      </div>

      <div class="panel" id="account-panel" hidden>
        <div id="connect-content">
          <div class="panel-heading"><h2>登录步骤</h2><button class="close" id="close-account" type="button" aria-label="收起登录面板">×</button></div>
          <ol class="login-steps">
            <li>复制授权链接，发到<strong>电脑微信的「文件传输助手」</strong>。<button class="copy" id="copy-link" type="button">复制授权链接</button><textarea id="public-link" rows="3" readonly hidden aria-label="微信授权链接，可手动复制"></textarea></li>
            <li>在微信里点开这条链接。等页面跳转后，点窗口右上角<strong>「···」→「复制链接」</strong>。</li>
            <li>回到这里，把<strong>刚复制的页面链接</strong>粘贴到下方，点击「登录」。</li>
          </ol>
          <form id="connect-form">
            <label class="sr-only" for="wechat-link">微信返回的完整链接</label>
            <textarea id="wechat-link" rows="2" autocomplete="off" spellcheck="false" placeholder="粘贴微信里复制的页面链接（含 code=）" required></textarea>
            <button class="primary connect-button" id="connect-button" type="submit">登录</button>
          </form>
        </div>
        <div id="connected-content" hidden><button class="disconnect" id="disconnect" type="button">退出登录</button></div>
      </div>

      <form id="monitor-form">
        <div class="row setting-row"><span id="course-label">课程</span><button class="course-picker" id="course-picker" type="button" aria-label="选择监听课程" aria-expanded="false" aria-controls="course-list" disabled><span id="course-summary">请先登录</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></button></div>
        <div class="course-list" id="course-list" hidden><label class="check-row all-courses"><input id="all-courses" type="checkbox"><span>全选</span></label><div id="course-options"></div></div>
        <div class="row setting-row"><label for="duration">监听时长</label><div class="select-wrap"><select id="duration"><option value="30">30 分钟</option><option value="60">1 小时</option><option value="90" selected>1.5 小时</option><option value="120">2 小时</option><option value="180">3 小时</option><option value="0">持续监听</option></select><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></div></div>
        <div class="action-area"><button class="primary monitor-button" id="monitor-button" type="submit" disabled><svg id="monitor-icon" viewBox="0 0 20 20" aria-hidden="true"><path class="play" d="m7 4 9 6-9 6Z"/><path class="pause" d="M6 5v10M14 5v10"/></svg><span id="monitor-label">开始监听</span><span class="spinner" id="monitor-spinner" hidden></span></button></div>
      </form>
    </section>

    <div class="monitor-status" id="monitor-status" role="status" hidden><span id="task-status"><i class="dot" aria-hidden="true"></i><span id="task-label">未开始</span></span><span id="due-label"></span></div>
    <div class="live-detail" id="live-detail" hidden><span id="read-detail" hidden>最近查询 <time id="last-read"></time></span><span id="confirmed-detail" hidden>签到成功 <time id="last-confirmed"></time></span></div>
    <section class="records" id="records-section" aria-labelledby="activity-title" hidden><h2 id="activity-title">最近记录</h2><ol class="event-list" id="events" aria-live="polite" aria-relevant="additions"></ol></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
