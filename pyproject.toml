[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stu-mcp"
version = "0.1.0"
description = "汕头大学学生的校园工具，供 MCP agents 按需调用"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=2.3,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "keyring>=25.6,<26", "cryptography>=45", "platformdirs>=4.3,<5",
  "tomlkit>=0.13,<1", "pypdf>=5,<7", "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26", "ruff>=0.12"]

[project.scripts]
stu-mcp = "stu_mcp.cli:main"
stu = "stu_mcp.cli:main"

[project.urls]
Repository = "https://github.com/0error0warning/stu-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/stu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
