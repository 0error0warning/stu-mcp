[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stu-mcp"
version = "0.7.5"
description = "面向 AI agents 的汕大校园工具，默认 HTTP/CLI，支持本地与个人服务器"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=2.3,<3", "httpx[socks]>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "keyring>=25.6,<26", "cryptography>=45", "platformdirs>=4.3,<5",
  "tomlkit>=0.13,<1", "ruamel.yaml>=0.18,<0.20", "pypdf>=5,<7", "qrcode>=8,<9",
  "pyotp>=2.9,<3", "packaging>=24,<27",
  "dnspython>=2.9,<3",
  "pywin32>=311; sys_platform == 'win32'",
  "requests>=2.31,<3", "websocket-client>=1.7,<2",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26", "ruff>=0.12", "playwright>=1.55,<2"]

[project.scripts]
stu-mcp = "stu_mcp.cli:main"
stu = "stu_mcp.cli:main"
stu-checkin = "stu_checkin.server:main"

[project.urls]
Repository = "https://github.com/0error0warning/stu-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/stu_mcp", "src/stu_checkin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/stu_checkin/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
