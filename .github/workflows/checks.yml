name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # Opening a PR must not cancel the push checks on the same commit.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - name: Prepare browser for setup interaction regressions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run python -m playwright install --with-deps chromium
      - run: uv run --extra dev ruff check .
      - name: Run tests with per-case progress and bounded-wait diagnostics
        run: uv run --extra dev pytest -v --durations=10 -o faulthandler_timeout=${{ matrix.python == '3.13' && 15 || 90 }}
      - name: Build the distributions and their matching Markdown Skill
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run --locked --extra dev python scripts/build_release.py --tag "$GITHUB_REF_NAME"
          else
            uv run --locked --extra dev python scripts/build_release.py
          fi
      - name: Verify isolated core wheel, MCP transports, clients and worker lifecycle
        run: uv run --locked --extra dev python scripts/check_installed_runtime.py
      - name: Verify offline self-update through installed commands and aliases
        run: uv run --locked --extra dev python scripts/check_update_runtime.py
      - name: Save checked tag artifacts for the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stu-mcp-release-${{ github.ref_name }}
          path: |
            dist/stu_mcp-*.whl
            dist/stu_mcp-*.tar.gz
            dist/stu-campus-v*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  docker-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the default core image without a desktop or browser extra
        run: docker build --tag stu-mcp-core-smoke .
      - name: Verify version and core imports without Playwright
        run: |
          docker run --rm --network none stu-mcp-core-smoke --version
          docker run --rm --network none --entrypoint python stu-mcp-core-smoke -c "import importlib.util; from stu_mcp.cli import parser; from stu_mcp.server import build_server; assert importlib.util.find_spec('playwright') is None; assert parser().parse_args(['login','mystu']).browser is False; print('core imports and default HTTP CLI available; Playwright absent')"
      - name: Read isolated offline status without starting school authentication
        run: docker run --rm --network none stu-mcp-core-smoke status
